name: tvOS Live TV

on:
  push:
    branches: ['codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tvos-live-tv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tvos:
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.1'
      - name: Build and test tvOS
        run: bash scripts/validate-tvos.sh
